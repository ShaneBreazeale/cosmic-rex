[workspace]
resolver = "3"
members = ["crates/backend", "crates/cosmic"]
default-members = ["crates/cosmic"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The swappable core: rex-rune without its UI, at one pinned revision. Only crates/backend may
# use it. Change the revision with scripts/update-backend.sh, which keeps all four in step.
# To hack on the core, point these at a local checkout instead (see docs/ARCHITECTURE.md).
[workspace.dependencies]
rex-rune = { git = "https://github.com/shuv1337/rex-rune", rev = "b38f257bef016ff0cc7699a340de503d73affddb", default-features = false }
rexrs = { git = "https://github.com/a10y/rexrs", rev = "780be3f9f0455c758273e57199af30bdaa145cf1", default-features = false }
ghostty-vt = { version = "=0.8.0", features = ["png"] }
rex-backend = { path = "crates/backend" }

# rex-rune's own patches; Cargo applies patches only from the top-level workspace.
[patch."https://github.com/a10y/rexrs"]
rexrs = { git = "https://github.com/shuv1337/rex-rune", rev = "b38f257bef016ff0cc7699a340de503d73affddb" }
[patch.crates-io]
ghostty-vt = { git = "https://github.com/shuv1337/rex-rune", rev = "b38f257bef016ff0cc7699a340de503d73affddb" }

[profile.dev.package."*"]
opt-level = 2
