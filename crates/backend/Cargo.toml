[package]
name = "rex-backend"
description = "The only crate that knows rex-rune: a small, frontend-neutral client API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rex-rune.workspace = true
rexrs.workspace = true
ghostty-vt.workspace = true
flume = "0.11"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
# The version rex-rune's public socket type comes from.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
